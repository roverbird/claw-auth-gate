[package]
name          = "claw-auth-gate"
version       = "0.1.0"
edition       = "2026"
description   = "A lightweight authentication gateway and session manager for zeroclaw built with Axum and SQLite."
license       = "MIT"
repository    = "https://github.com/roverbird/claw-auth-gate"
readme        = "README.md"
keywords      = ["axum", "gateway", "jwt", "sqlite", "zeroclaw"]
categories    = ["web-programming", "authentication"]

[dependencies]
axum              = { version = "0.8",  features = ["ws"] }
tokio             = { version = "1",    features = ["full"] }
serde             = { version = "1",    features = ["derive"] }
toml              = "0.8"
jsonwebtoken      = "9"
reqwest           = { version = "0.12", features = ["json"] }
rusqlite          = { version = "0.31", features = ["bundled"] }
r2d2              = "0.8"
r2d2_sqlite       = "0.24"
serde_json        = "1"
tokio-tungstenite = "0.24"
futures           = "0.3"
dashmap           = "6"

[profile.release]
opt-level     = 3
lto           = true
strip         = true
codegen-units = 1
